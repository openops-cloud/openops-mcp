[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openops-mcp"
version = "0.2.0"
description = "MCP server exposing OpenOps API operations as tools"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastmcp==3.4.5",
    "httpx>=0.28.1,<1.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0,<7.0",
    "logzio-python-handler>=4.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[project.scripts]
openops-mcp = "openops_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["openops_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "logzio.*"
ignore_missing_imports = true
